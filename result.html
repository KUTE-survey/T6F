<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室内環境フィードバック</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #f5f4f0;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 480px;
    margin: 0 auto 16px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.07);
  }
 h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
  .updated { font-size: 12px; color: #bbb; margin-bottom: 20px; }
  .section-label { font-size:13px; font-weight:600; color:#888; margin-bottom:10px; }
  .dist-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .dist-icon { font-size:16px; width:22px; text-align:center; flex-shrink:0; }
  .dist-lbl { font-size:12px; color:#888; width:80px; flex-shrink:0; }
  .bar-bg { flex:1; background:#f0f0f0; border-radius:4px; height:10px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition: width 0.6s ease; }
  .dist-pct { font-size:13px; font-weight:600; width:34px; text-align:right; color:#333; flex-shrink:0; }
  .loading-msg { font-size:13px; color:#aaa; margin-bottom:16px; }
  .metric-single {
    background: #f5f4f0; border-radius: 12px;
    padding: 16px; text-align: center; margin-bottom: 20px;
  }
  .metric-single .val { font-size: 36px; font-weight: 700; color: #1a1a1a; }
  .metric-single .unit { font-size: 16px; color: #aaa; }
  .metric-single .lbl { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  .badge-ok   { display:inline-block; font-size:12px; padding:3px 10px; border-radius:6px; margin-top:6px; background:#e6f4e6; color:#2e7d32; }
  .badge-warn { display:inline-block; font-size:12px; padding:3px 10px; border-radius:6px; margin-top:6px; background:#fff3e0; color:#e65100; }
  .comfort-row { display:flex; gap:16px; flex-wrap:wrap; background:#f5f4f0; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:13px; color:#555; }
  .chart-wrap { position:relative; width:100%; height:200px; margin-bottom:6px; overflow:visible; }
  .chart-note { font-size:11px; color:#bbb; text-align:right; margin-bottom:8px; }
  .error-msg { font-size:12px; color:#e65100; margin-bottom:8px; }
</style>
</head>
<body>

<div class="card">
 <h1>現在の室内環境(6F)</h1>
  <p class="updated" id="updated-at">取得中…</p>

  <!-- みんなの感じ方 -->
  <div class="section-label">みんなの感じ方（<span id="total-count">取得中</span>件中）</div>
  <div id="dist-bars" style="margin-bottom:20px;">
    <div class="loading-msg">回答データを読み込み中…</div>
  </div>

  <!-- 室温のみ -->
  <div class="metric-single">
    <div class="lbl">室温</div>
    <div class="val" id="m-temp">--<span class="unit">°C</span></div>
    <span class="badge-ok" id="b-temp">取得中</span>
  </div>

  <div class="comfort-row">
    <span>🌡 快適域：<strong>24〜27°C</strong></span>
  </div>

  <!-- 室温グラフ -->
  <div class="chart-wrap">
    <canvas id="chart" role="img" aria-label="本日の室温の時間推移"></canvas>
  </div>
  <p class="chart-note">※ 毎時0分・30分の瞬時値を折れ線グラフで表示しています</p>
</div>

<script>
// ★場所ごとに変更するURL★
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwLEkj5j6WcDVW5uivr_JdriEOrQtKQfTGNcldIc43fG4kSrNXO5ltBuNcGZ3LX8MfqYQ/exec';

const OPTS = [
  { v:5, icon:'🥵', label:'とても暑い', formLabel:'とても暑い（汗ばむほど暑い）' },
  { v:4, icon:'😓', label:'やや暑い',   formLabel:'やや暑い（少し暑さを感じる）' },
  { v:3, icon:'😊', label:'ちょうどよい', formLabel:'ちょうどよい（快適）' },
  { v:2, icon:'☹️', label:'やや寒い',   formLabel:'やや寒い（少し肌寒い）' },
  { v:1, icon:'😖', label:'とても寒い', formLabel:'とても寒い（震えてしまうほど寒い）' },
];
const BAR_COLORS = { 5:'#D85A30', 4:'#EF9F27', 3:'#639922', 2:'#378ADD', 1:'#534AB7' };

function renderDist(counts, total) {
  document.getElementById('total-count').textContent = total;
  const container = document.getElementById('dist-bars');
  container.innerHTML = OPTS.map(o => {
    const cnt = counts[o.formLabel] || 0;
    const pct = total > 0 ? Math.round(cnt / total * 100) : 0;
    return `<div class="dist-row">
      <div class="dist-icon">${o.icon}</div>
      <div class="dist-lbl">${o.label}</div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${pct}%;background:${BAR_COLORS[o.v]}"></div>
      </div>
      <div class="dist-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function fetchGASData() {
  const callbackName = 'gasCallback_' + Date.now();
  const script = document.createElement('script');
  script.src = GAS_URL + '?callback=' + callbackName;
  window[callbackName] = function(data) {
    document.getElementById('dist-bars').innerHTML = '';
    if (data && data.counts) {
      renderDist(data.counts, data.total);
    } else {
      document.getElementById('dist-bars').innerHTML =
        '<div class="error-msg">回答データを取得できませんでした。</div>';
    }
    delete window[callbackName];
    script.remove();
  };
  script.onerror = function() {
    document.getElementById('dist-bars').innerHTML =
      '<div class="error-msg">通信エラー。しばらくしてから再読み込みしてください。</div>';
    delete window[callbackName];
    script.remove();
  };
  document.head.appendChild(script);
}

// GASとdata.jsonを並列で取得
fetchGASData();
setInterval(fetchGASData, 2 * 60 * 1000);

// 30分ごとの全ラベル（7:00〜22:00）
const ALL_LABELS = [
  '07:00','07:30','08:00','08:30','09:00','09:30',
  '10:00','10:30','11:00','11:30','12:00','12:30',
  '13:00','13:30','14:00','14:30','15:00','15:30',
  '16:00','16:30','17:00','17:30','18:00','18:30',
  '19:00','19:30','20:00','20:30','21:00','21:30','22:00'
];

const TICK_LABELS = new Set(['07:00','10:00','13:00','16:00','19:00','22:00']);
const GRID_LABELS = new Set([
  '07:00','08:00','09:00','10:00','11:00','12:00','13:00',
  '14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'
]);

fetch('./data.json')
  .then(r => r.json())
  .then(d => {
    // 室温表示
    document.getElementById('m-temp').innerHTML =
      d.temperature + '<span style="font-size:16px;color:#aaa">°C</span>';

    const tempOk = d.temperature >= 24 && d.temperature <= 27;
    const b = (ok, okTxt, ngTxt) =>
      `<span class="${ok ? 'badge-ok' : 'badge-warn'}">${ok ? okTxt : ngTxt}</span>`;
    document.getElementById('b-temp').outerHTML = b(tempOk, '快適域内', '範囲外');

    const dt = new Date(d.updated_at);
    document.getElementById('updated-at').innerHTML =
      `${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')} 時点のデータ`;

    // 日本時間で今日の日付を取得
    const jstNow = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
    const today = jstNow.toISOString().slice(0, 10);

    // 今日のデータだけ抽出
    const todayHistory = (d.history || []).filter(h => h.date === today);
    if (todayHistory.length === 0) return;

    // ±3分以内のデータを固定ラベルにマッピング
    const historyMap = {};
    todayHistory.forEach(h => {
      const [hh, mm] = h.time.split(':').map(Number);
      const totalMin = hh * 60 + mm;
      ALL_LABELS.forEach(label => {
        const [lh, lm] = label.split(':').map(Number);
        const labelMin = lh * 60 + lm;
        const diff = Math.abs(totalMin - labelMin);
        if (diff <= 3) {
          if (!historyMap[label] || diff < historyMap[label].diff) {
            historyMap[label] = { ...h, diff };
          }
        }
      });
    });

    const temps = ALL_LABELS.map(l => historyMap[l] ? historyMap[l].temp : null);

    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ALL_LABELS,
        datasets: [{
          label:'室温',
          data: temps,
          borderColor:'#D85A30',
          backgroundColor:'transparent',
          fill: false,
          tension: 0.4,
          pointRadius: 3,
          spanGaps: false,
          clip: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins:{ legend:{ display:false } },
        scales:{
          y: {
            min: 20, max: 28,
            title:{ display:true, text:'温度(°C)', font:{size:11} },
            grid:{ color:'rgba(0,0,0,0.05)' },
            ticks:{ font:{size:11}, stepSize:2 }
          },
          x: {
            grid:{
              color: function(ctx) {
                const label = ALL_LABELS[ctx.index];
                return GRID_LABELS.has(label) ? 'rgba(0,0,0,0.06)' : 'transparent';
              },
              lineWidth: 1
            },
            ticks:{
              font:{size:11},
              maxRotation:0,
              callback: function(val, index) {
                const label = ALL_LABELS[index];
                return TICK_LABELS.has(label) ? label : '';
              }
            }
          }
        }
      }
    });
  })
  .catch(() => {
    document.getElementById('updated-at').textContent = 'センサーデータ読み込みエラー';
  });
</script>
</body>
</html>
